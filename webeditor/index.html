<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Task Master – editor</title>
  <style>
    /* Barvy a velikosti dodá hostitel přes TM.setTheme() jako --crepe-* / --tm-*
       proměnné (téma + zoom aplikace); tohle jsou jen bezpečné výchozí hodnoty. */
    html { font-size: var(--tm-font-size, 16px); }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--crepe-color-background, #fff); }
    #editor { min-height: 100%; font-size: var(--tm-font-size, 16px); }
    /* Crepe sám dává editoru padding 60px 120px (reset.css); hostitel ho nastaví
       přes --tm-pad (zoom). Spodní rezerva --tm-pad-bottom: na desktopu malá,
       na mobilu větší, aby šlo psát na konci dokumentu nad klávesnicí. */
    #editor .milkdown .ProseMirror {
      padding: var(--tm-pad, 12px) var(--tm-pad, 12px) var(--tm-pad-bottom, 24px);
      outline: none;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
